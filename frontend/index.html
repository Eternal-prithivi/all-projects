    <meta name="theme-color" content="#050505" />
    <meta name="msapplication-TileColor" content="#050505" />
    <link rel="canonical" href="https://rajverse.me/" />

    <!-- Favicons — solid #050505 background (Google Search mats transparent icons gray) -->
    <link rel="icon" href="/favicon.ico?v=4" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />

    <link rel="icon" type="image/png" sizes="512x512" href="/zenith-icon-solid.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png?v=4" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png?v=4" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / social (logo in link previews & some search surfaces) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zenith Cloud Platform" />
    <meta property="og:title" content="Zenith Cloud Platform | Multi-Cloud Resource Optimization" />
    <meta property="og:description" content="Optimize AWS, GCP, and Azure costs with Zenith — analytics, storage tiering, VM clusters, and infrastructure provisioning in one platform." />
    <meta property="og:url" content="https://rajverse.me/" />
    <meta property="og:image" content="https://rajverse.me/og-image.png?v=4" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zenith Cloud Platform logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zenith Cloud Platform" />
    <meta name="twitter:description" content="Multi-cloud cost analytics, storage tiering, and infrastructure management for AWS, GCP, and Azure." />
    <meta name="twitter:image" content="https://rajverse.me/og-image.png?v=4" />

    <!-- Structured data for organization logo in search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Zenith Cloud Platform",
        "alternateName": "Zenith",
        "url": "https://rajverse.me/",
        "image": "https://rajverse.me/zenith-icon-solid.png?v=4",
        "logo": {
          "@type": "ImageObject",
          "url": "https://rajverse.me/zenith-icon-solid.png?v=4",
          "width": 512,
          "height": 512,
          "caption": "Zenith Cloud Platform logo"
        },
        "description": "Multi-cloud resource optimization and management platform for AWS, GCP, and Azure."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Zenith Cloud Platform",
        "url": "https://rajverse.me/"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('zenith-theme') || 'dark';
          var effective = pref;
          if (pref === 'auto') {
            effective = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } else if (pref !== 'light') {
            effective = 'dark';
          }
          document.documentElement.dataset.theme = effective;
          document.documentElement.style.colorScheme = effective;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
