<!DOCTYPE html>
<html lang="en" style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenith Cloud Platform | Multi-Cloud Resource Optimization</title>
    <meta name="description" content="Zenith is a multi-cloud resource optimization platform for AWS, GCP, and Azure — cost analytics, smart storage tiering, VM clusters, and secure infrastructure provisioning." />
    <meta name="application-name" content="Zenith" />
    <meta name="theme-color" content="#c9a227" />
    <link rel="canonical" href="https://zenith-frontend.vercel.app/" />

    <!-- Favicons (Google Search uses /favicon.ico and declared icons) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / social (logo in link previews & some search surfaces) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zenith Cloud Platform" />
    <meta property="og:title" content="Zenith Cloud Platform | Multi-Cloud Resource Optimization" />
    <meta property="og:description" content="Optimize AWS, GCP, and Azure costs with Zenith — analytics, storage tiering, VM clusters, and infrastructure provisioning in one platform." />
    <meta property="og:url" content="https://zenith-frontend.vercel.app/" />
    <meta property="og:image" content="https://zenith-frontend.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zenith Cloud - cloud resource optimization platform logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zenith Cloud Platform" />
    <meta name="twitter:description" content="Multi-cloud cost analytics, storage tiering, and infrastructure management for AWS, GCP, and Azure." />
    <meta name="twitter:image" content="https://zenith-frontend.vercel.app/og-image.png" />

    <!-- Structured data for organization logo in search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Zenith Cloud Platform",
        "alternateName": "Zenith",
        "url": "https://zenith-frontend.vercel.app/",
        "logo": "https://zenith-frontend.vercel.app/icon-512.png",
        "description": "Multi-cloud resource optimization and management platform for AWS, GCP, and Azure."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Zenith Cloud Platform",
        "url": "https://zenith-frontend.vercel.app/"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('zenith-theme') || 'dark';
          var effective = pref;
          if (pref === 'auto') {
            effective = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } else if (pref !== 'light') {
            effective = 'dark';
          }
          document.documentElement.dataset.theme = effective;
          document.documentElement.style.colorScheme = effective;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body style="height: 100%; margin: 0">
    <div id="root" style="height: 100%"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
