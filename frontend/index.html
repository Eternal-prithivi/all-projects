<!DOCTYPE html>
<html lang="en" style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon for modern browsers -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Favicon for older browsers -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zenith - Multi-cloud resource optimization and management platform" />
    <meta name="theme-color" content="#d4af37" />
    <title>Zenith Cloud Platform</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('zenith-theme') || 'dark';
          var effective = pref;
          if (pref === 'auto') {
            effective = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } else if (pref !== 'light') {
            effective = 'dark';
          }
          document.documentElement.dataset.theme = effective;
          document.documentElement.style.colorScheme = effective;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body style="height: 100%; margin: 0">
    <div id="root" style="height: 100%"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
