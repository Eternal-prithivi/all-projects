<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#iconGradient)"/>
  
  <!-- Cloud shape -->
  <g transform="translate(256, 256)">
    <path d="M -80 -20 C -80 -60 -40 -90 0 -90 C 10 -120 40 -140 70 -140 C 110 -140 140 -110 140 -70 C 180 -70 210 -40 210 0 C 210 40 180 70 140 70 L -60 70 C -100 70 -130 40 -130 0 C -130 -30 -110 -50 -80 -20 Z" 
          fill="#fff" 
          opacity="0.95"/>
    
    <!-- Server icon inside cloud -->
    <g transform="translate(-40, -30)">
      <rect x="0" y="0" width="80" height="15" rx="3" fill="url(#highlightGradient)" opacity="0.9"/>
      <rect x="0" y="20" width="80" height="15" rx="3" fill="url(#highlightGradient)" opacity="0.7"/>
      <rect x="0" y="40" width="80" height="15" rx="3" fill="url(#highlightGradient)" opacity="0.5"/>
      
      <!-- Small dots for LEDs -->
      <circle cx="10" cy="7.5" r="2" fill="#1a1a2e"/>
      <circle cx="10" cy="27.5" r="2" fill="#1a1a2e"/>
      <circle cx="10" cy="47.5" r="2" fill="#1a1a2e"/>
    </g>
  </g>
  
  <!-- Letter Z overlay -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#1a1a2e" text-anchor="middle" opacity="0.1">
    Z
  </text>
</svg>
