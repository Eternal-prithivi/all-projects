<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cloud icon -->
  <g transform="translate(10, 15)">
    <!-- Cloud shape -->
    <path d="M 8 16 C 8 12 11 9 15 9 C 16 6 19 4 22 4 C 26 4 29 7 29 11 C 32 11 35 14 35 17 C 35 20 32 23 29 23 L 11 23 C 8 23 6 21 6 18 C 6 16 7 15 8 16 Z" 
          fill="url(#logoGradient)" 
          stroke="#fff" 
          stroke-width="1"/>
    
    <!-- Server bars inside cloud -->
    <rect x="13" y="12" width="16" height="2" rx="1" fill="#fff" opacity="0.9"/>
    <rect x="13" y="15" width="16" height="2" rx="1" fill="#fff" opacity="0.7"/>
    <rect x="13" y="18" width="16" height="2" rx="1" fill="#fff" opacity="0.5"/>
  </g>
  
  <!-- Text: Zenith -->
  <text x="55" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#textGradient)">
    Zenith
  </text>
  
  <!-- Tagline -->
  <text x="56" y="50" font-family="Arial, sans-serif" font-size="8" fill="#a0aec0" letter-spacing="1">
    CLOUD PLATFORM
  </text>
</svg>
