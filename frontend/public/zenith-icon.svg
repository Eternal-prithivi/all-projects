<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Zenith Cloud">
  <defs>
    <linearGradient id="cloudBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8c6c0"/>
      <stop offset="45%" stop-color="#9a9892"/>
      <stop offset="100%" stop-color="#6e6c66"/>
    </linearGradient>
    <linearGradient id="cloudShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cloudShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4844" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a2826" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="zBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d868"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="zSlash" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="50%" stop-color="#e8c84a"/>
      <stop offset="100%" stop-color="#9a6f00"/>
    </linearGradient>
  </defs>

  <!-- Cloud shadow (depth) -->
  <path
    fill="#2a2826"
    opacity="0.5"
    d="M5 38.5c0-1.2 1-2 2.2-2 0-3.2 3.2-5.8 7.2-5.8 1.3 0 2.5.4 3.4 1.2 1-.2 2-.35 3-.35 4.2 0 7.6 3.4 7.6 7.5 0 3.8-3 6.8-6.5 6.8H7c-1.1 0-2-.9-2-2.2z"
    transform="translate(0 1.2)"
  />

  <!-- Main cloud body -->
  <path
    fill="url(#cloudBody)"
    d="M4 37.2c0-3.2 2.6-5.6 5.8-5.8.8-3.4 3.8-6 7.8-6 2.2 0 4.2.9 5.6 2.6 1.2-.3 2.4-.5 3.7-.5 4.8 0 8.7 3.9 8.7 8.6 0 4.4-3.6 7.9-8 7.9H8.2c-2.3 0-4.2-1.9-4.2-4.2z"
  />

  <!-- Cloud top shine -->
  <path
    fill="url(#cloudShine)"
    d="M4 37.2c0-3.2 2.6-5.6 5.8-5.8.8-3.4 3.8-6 7.8-6 2.2 0 4.2.9 5.6 2.6 1.2-.3 2.4-.5 3.7-.5 4.8 0 8.7 3.9 8.7 8.6 0 4.4-3.6 7.9-8 7.9H8.2c-2.3 0-4.2-1.9-4.2-4.2z"
  />

  <!-- Puff highlights (readable cloud bumps) -->
  <ellipse cx="11.5" cy="27.5" rx="5.5" ry="4" fill="#e8e6e0" opacity="0.5"/>
  <ellipse cx="24" cy="24.5" rx="7" ry="5" fill="#eceae4" opacity="0.55"/>
  <ellipse cx="36" cy="27.5" rx="5.5" ry="4" fill="#e8e6e0" opacity="0.5"/>

  <!-- Bottom shadow on cloud -->
  <path
    fill="url(#cloudShadow)"
    d="M4 37.2c0-3.2 2.6-5.6 5.8-5.8.8-3.4 3.8-6 7.8-6 2.2 0 4.2.9 5.6 2.6 1.2-.3 2.4-.5 3.7-.5 4.8 0 8.7 3.9 8.7 8.6 0 4.4-3.6 7.9-8 7.9H8.2c-2.3 0-4.2-1.9-4.2-4.2z"
  />

  <!-- Gold accent rim -->
  <path
    fill="none"
    stroke="#d4af37"
    stroke-opacity="0.55"
    stroke-width="1"
    d="M4 37.2c0-3.2 2.6-5.6 5.8-5.8.8-3.4 3.8-6 7.8-6 2.2 0 4.2.9 5.6 2.6 1.2-.3 2.4-.5 3.7-.5 4.8 0 8.7 3.9 8.7 8.6 0 4.4-3.6 7.9-8 7.9H8.2c-2.3 0-4.2-1.9-4.2-4.2z"
  />

  <!-- Z monogram (sits on cloud) -->
  <rect x="11" y="6.5" width="26" height="4.8" rx="1.2" fill="url(#zBar)"/>
  <rect x="11" y="24.2" width="26" height="4.8" rx="1.2" fill="url(#zBar)"/>
  <polygon fill="url(#zSlash)" points="30,11.5 36.5,11.5 18,24.2 11.5,24.2"/>
  <polygon fill="#fff8d0" opacity="0.38" points="30,11.5 32.2,11.5 13.7,24.2 11.5,24.2"/>
</svg>
