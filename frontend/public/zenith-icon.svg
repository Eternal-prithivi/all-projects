<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Zenith">
  <defs>
    <linearGradient id="zBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c558"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="zSlash" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbe38a"/>
      <stop offset="55%" stop-color="#e6c558"/>
      <stop offset="100%" stop-color="#9a6f00"/>
    </linearGradient>
  </defs>
  <!-- Z top bar -->
  <rect x="11" y="11" width="26" height="5.2" rx="1.4" fill="url(#zBar)"/>
  <!-- Z bottom bar -->
  <rect x="11" y="31.6" width="26" height="5.2" rx="1.4" fill="url(#zBar)"/>
  <!-- Z diagonal — hero stroke -->
  <polygon fill="url(#zSlash)" points="30,16.2 37,16.2 18,31.6 11,31.6"/>
  <!-- subtle highlight edge on diagonal -->
  <polygon fill="#fff3c4" opacity="0.35" points="30,16.2 32.4,16.2 13.4,31.6 11,31.6"/>
</svg>
