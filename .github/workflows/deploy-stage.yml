# Deploy stage only after CI succeeds on the same commit (Phase 20.5.1).
name: Deploy Stage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [stage]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'stage'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Trigger Render backend deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK not configured; skip backend deploy."
          fi

      - name: Deploy frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: frontend
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Vercel secrets not configured; skip frontend deploy."
            exit 0
          fi
          npm ci
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel build --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"

      - name: Post-deploy stage smoke (Phase 20.5.4)
        env:
          STAGE_API_URL: ${{ secrets.STAGE_API_URL }}
        run: |
          if [ -z "$STAGE_API_URL" ]; then
            echo "STAGE_API_URL not set; skip post-deploy smoke."
            exit 0
          fi
          BASE="${STAGE_API_URL%/}"
          echo "Waiting 90s for Render/Vercel cold start..."
          sleep 90
          curl -fsS "${BASE}/health"
          curl -fsS "${BASE}/api/platform/status"
