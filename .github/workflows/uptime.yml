# Optional external sanity check — set repository secret UPTIME_API_URL (e.g. https://your-api.onrender.com)
name: Uptime check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        env:
          UPTIME_API_URL: ${{ secrets.UPTIME_API_URL }}
        run: |
          if [ -z "${UPTIME_API_URL}" ]; then
            echo "Set UPTIME_API_URL repository secret to enable scheduled uptime checks."
            exit 0
          fi

          BASE="${UPTIME_API_URL%/}"
          curl -fsS "${BASE}/health/ready" | tee health.json
          curl -fsS "${BASE}/api/platform/status" | tee status.json
          python3 -c "import json; h=json.load(open('health.json')); assert h.get('mongo_connected') is True, h"
