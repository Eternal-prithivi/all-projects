# Phase 20.5.9 — detect committed secrets
name: Secret scan

on:
  push:
    branches: [main, master, stage, develop]
  pull_request:
    branches: [main, master, stage, develop]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
