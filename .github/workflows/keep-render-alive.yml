name: Keep Render Backend Alive

on:
  schedule:
    # Ping every 5 minutes to prevent 15min inactivity spin-down
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render backend to keep it alive..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://zenith-backend-707i.onrender.com/docs)
          echo "Response code: $response"
          
          if [ $response -eq 200 ] || [ $response -eq 307 ]; then
            echo "✅ Backend is alive!"
          else
            echo "⚠️  Backend returned unexpected status: $response"
          fi
      
      - name: Health Check
        run: |
          echo "Performing health check..."
          curl -s https://zenith-backend-707i.onrender.com/docs | head -c 100
          echo ""
          echo "Health check complete"
