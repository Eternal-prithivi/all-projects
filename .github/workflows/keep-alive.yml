name: Keep Backend Alive

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          curl -f https://zenith-backend-707i.onrender.com/health || echo "Health check failed"
          
      - name: Ping Root Endpoint
        run: |
          curl -f https://zenith-backend-707i.onrender.com/ || echo "Root check failed"
