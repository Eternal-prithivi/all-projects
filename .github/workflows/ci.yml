name: CI

on:
  push:
    branches: [main, master, stage, develop]
  pull_request:
    branches: [main, master, stage, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_CONNECTION_STRING: mongodb://localhost:27017
      MONGO_DB_NAME: zenith_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov
      - name: Sensitive detector benchmark
        run: python scripts/security_detector_benchmark.py
      - name: Pytest with coverage
        run: |
          python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
      - name: Terraform init (local backend for CI)
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  playwright:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    continue-on-error: true
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    # Match backend/tests/conftest.py — uvicorn loads Settings at import time (no pytest hook).
    env:
      MONGO_CONNECTION_STRING: mongodb://localhost:27017
      MONGO_DB_NAME: zenith_test
      SECRET_KEY: pytest-secret-key-do-not-use-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      AWS_ACCESS_KEY_ID: test-aws-key
      AWS_SECRET_ACCESS_KEY: test-aws-secret
      S3_BUCKET_NAME: test-bucket
      REGULAR_S3_BUCKET_NAME: test-regular-bucket
      SECURE_S3_BUCKET_NAME: test-secure-bucket
      REPLICA_S3_BUCKET_NAME: test-replica-bucket
      REPLICA_S3_REGION: us-east-1
      PRIMARY_S3_REGION: us-east-1
      CELERY_BROKER_URL: redis://localhost:6379/0
      GCP_BUCKET_NAME: test-gcp-bucket
      GCP_PROJECT_ID: test-gcp-project
      GCP_ZONE: us-central1-a
      GCP_SERVICE_ACCOUNT_JSON_PATH: ""
      AZURE_STORAGE_ACCOUNT_NAME: testazure
      AZURE_STORAGE_ACCOUNT_KEY: testazurekey
      AZURE_CONTAINER_NAME: test-container
      AZURE_TENANT_ID: test-tenant
      AZURE_CLIENT_ID: test-client
      AZURE_CLIENT_SECRET: test-secret
      FRONTEND_URL: http://127.0.0.1:5173
      BACKEND_URL: http://127.0.0.1:8000
      ENVIRONMENT: test
      DEMO_MODE: "true"
      RAZORPAY_KEY_ID: rzp_test
      RAZORPAY_KEY_SECRET: rzp_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend for E2E API
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start backend API
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:8000/api/platform/status && exit 0
            sleep 2
          done
          echo "Backend failed to start"
          exit 1
      - name: Seed E2E admin user
        working-directory: backend
        run: python scripts/seed_e2e_admin.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install chromium --with-deps
      - name: Playwright smoke
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          PLAYWRIGHT_API_URL: http://127.0.0.1:8000
          VITE_API_URL: http://127.0.0.1:8000
