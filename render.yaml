services:
  - type: web
    name: zenith-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    # requirements.txt includes en_core_web_sm wheel (NER for Phase 6 NLP)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Fast liveness endpoint — must not block on MongoDB (see app/main.py /health)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://zenith-frontend.vercel.app
