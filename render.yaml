services:
  - type: web
    name: zenith-api
    env: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://rajverse.me
      - key: BACKEND_URL
        value: https://api.rajverse.me
      - key: PUBLIC_API_URL
        value: https://api.rajverse.me
      - key: ZENITH_SERVICE_ROLE
        value: api
      - key: PROVISION_OFFLOAD_TERRAFORM
        value: "true"
      - key: GCP_SECURE_BUCKET_NAME
        value: zenith-secure-gcp
      - key: GCP_SECURE_REPLICA_BUCKET_NAME
        value: zenith-secure-gcp-replica
      - key: AZURE_SECURE_CONTAINER_NAME
        value: zenith-secure
      - key: AZURE_SECURE_REPLICA_CONTAINER_NAME
        value: zenith-secure-replica

  - type: worker
    name: zenith-celery
    env: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile.api
    dockerCommand: celery -A app.celery_worker worker --beat --loglevel=info --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ZENITH_SERVICE_ROLE
        value: worker
      - key: GCP_SECURE_BUCKET_NAME
        value: zenith-secure-gcp
      - key: GCP_SECURE_REPLICA_BUCKET_NAME
        value: zenith-secure-gcp-replica
      - key: AZURE_SECURE_CONTAINER_NAME
        value: zenith-secure
      - key: AZURE_SECURE_REPLICA_CONTAINER_NAME
        value: zenith-secure-replica

  - type: worker
    name: zenith-provision
    env: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile.provision
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ZENITH_SERVICE_ROLE
        value: provision
      - key: PROVISION_CELERY_QUEUE
        value: provision
      - key: GCP_SECURE_BUCKET_NAME
        value: zenith-secure-gcp
      - key: GCP_SECURE_REPLICA_BUCKET_NAME
        value: zenith-secure-gcp-replica
      - key: AZURE_SECURE_CONTAINER_NAME
        value: zenith-secure
      - key: AZURE_SECURE_REPLICA_CONTAINER_NAME
        value: zenith-secure-replica
