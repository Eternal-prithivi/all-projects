services:
  - type: web
    name: zenith-backend
    env: docker
    region: singapore
    plan: free
    rootDir: backend
    # Dockerfile installs Terraform CLI, copies terraform/ modules, pre-downloads
    # AWS provider plugins, and starts uvicorn — required for /api/provision to work.
    # DO NOT switch back to env: python — Terraform CLI will not be available and
    # all infrastructure deploy endpoints will return 503.
    dockerfilePath: ./Dockerfile
    # Fast liveness endpoint — must not block on MongoDB (see app/main.py /health)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://rajverse.me

  # Background jobs: storage tiering, cost anomalies, ML retrain, VM agent, drift checks.
  # Copy the same env vars as zenith-backend in the Render dashboard (CELERY_BROKER_URL, Mongo, etc.).
  - type: worker
    name: zenith-celery
    env: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.celery_worker worker --beat --loglevel=info --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
